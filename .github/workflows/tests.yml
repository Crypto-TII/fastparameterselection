name: tests

on:
  push:
  pull_request:

jobs:
  # Formulas, numerical solvers and the per-call generators. These import
  # nothing that needs SageMath, so they run on a plain Python and are the
  # fast guard against a formula changing without the paper changing.
  formulas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy lmfit pytest
      - name: Run the tests that do not need SageMath
        run: python -m pytest -q
        # Tests marked needs_sage skip themselves; see tests/conftest.py.

  # The command line and the refitting of src/const.py both go through
  # src/nd.py, which imports sage.all.
  full:
    runs-on: ubuntu-latest
    container: sagemath/sagemath:10.3
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies into Sage's interpreter
        run: sage --python3 -m pip install --user lmfit pytest
      - name: Run the whole suite
        run: sage --python3 -m pytest -q
